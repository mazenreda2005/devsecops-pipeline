name: DevSecOps pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: devsecops-demo

jobs:
  # 1. Leaked credentials anywhere in git history
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # required by upload-sarif to read the workflow run
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan full history, not just the last commit

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 \
            detect --source /repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # 2. Python code: unit tests + static analysis
  code-scan:
    name: Code (tests + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install
        run: pip install -r app/requirements.txt pytest bandit

      - name: Unit tests
        run: pytest -q app/tests

      - name: Bandit (fail on medium+ severity)
        run: bandit -r app -x app/tests --severity-level medium

  # 3. Terraform, Dockerfile and workflow misconfigurations
  iac-scan:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # required by upload-sarif to read the workflow run
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  # 4. Container image: OS + library CVEs, plus an SBOM
  container-scan:
    name: Container (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # required by upload-sarif to read the workflow run
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" app

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Export findings as SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  # 5. Deploy only when every gate passed, only from main,
  #    using short-lived OIDC credentials (no AWS keys stored in GitHub).
  deploy:
    name: Deploy to AWS
    needs: [secrets-scan, code-scan, iac-scan, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v5

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=devsecops-demo/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve -var "region=$AWS_REGION"
          echo "REPO_URL=$(terraform output -raw repository_url)" >> "$GITHUB_ENV"

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build --build-arg APP_VERSION="${{ github.sha }}" -t "$REPO_URL:${{ github.sha }}" app
          docker push "$REPO_URL:${{ github.sha }}"
          echo "Pushed $REPO_URL:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
